name: Build and deploy signature add-in

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Build launchevent.js
        run: |
          mkdir -p _site
          npx esbuild src/launchevent.src.js --bundle --format=iife --target=es2017 --minify --legal-comments=none --banner:js="$(cat build/config.js)" --outfile=_site/launchevent.js
          cp commands.html manifest.xml icon-*.png _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
